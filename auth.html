<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jotat — Log in</title>
  <meta name="theme-color" content="#d9d9cf">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Instrument+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/version.js"></script>
  <script src="js/motion.js" defer></script>
</head>
<body>

  <header class="topbar">
    <a class="logo" href="index.html">Jotat.<br>Notes &amp; Scans.</a>
    <span></span>
    <div class="topbar__right">
      <span class="mono-label" data-version>v1.0.0</span>
      <a class="pill pill--glass pill--sm" href="index.html">← Home</a>
    </div>
  </header>

  <main class="auth">
    <h1 class="auth__big" id="bigTitle">
      Welcome<br>back.
      <small id="bigSub">Log in to pick up where you left off — every note, photo and scan is waiting.</small>
    </h1>

    <section class="auth__card">
      <div class="tabs" role="tablist">
        <button role="tab" id="tabLogin" aria-selected="true">Log in</button>
        <button role="tab" id="tabSignup" aria-selected="false">Sign up</button>
      </div>

      <div class="msg" id="msg" role="alert"></div>

      <button type="button" class="pill pill--glass btn-block google-btn" id="googleBtn">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        <span id="googleLabel">Continue with Google</span>
      </button>
      <div class="divider mono-label"><span>or with email</span></div>

      <!-- LOGIN -->
      <form id="loginForm" novalidate>
        <label class="field">
          <span class="mono-label">Email</span>
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label class="field">
          <span class="mono-label">Password</span>
          <div class="field__pw">
            <input type="password" name="password" autocomplete="current-password" required>
            <button type="button" class="mono-label toggle-pw">Show</button>
          </div>
        </label>
        <div class="row mono-label">
          <label class="check"><input type="checkbox" name="remember" checked> Remember me</label>
          <button type="button" class="link mono-label" id="forgotBtn">Forgot password?</button>
        </div>
        <button class="pill pill--dark btn-block" type="submit">Log in</button>
      </form>

      <!-- SIGNUP -->
      <form id="signupForm" class="hidden" novalidate>
        <label class="field">
          <span class="mono-label">Name</span>
          <input type="text" name="name" autocomplete="name" required>
        </label>
        <label class="field">
          <span class="mono-label">Email</span>
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label class="field">
          <span class="mono-label">Password (min 6 characters)</span>
          <div class="field__pw">
            <input type="password" name="password" autocomplete="new-password" minlength="6" required>
            <button type="button" class="mono-label toggle-pw">Show</button>
          </div>
        </label>
        <label class="field">
          <span class="mono-label">Confirm password</span>
          <input type="password" name="confirm" autocomplete="new-password" required>
        </label>
        <button class="pill pill--dark btn-block" type="submit" style="margin-top:10px">Create account</button>
      </form>

    </section>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
