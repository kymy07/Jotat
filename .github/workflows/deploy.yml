name: Deploy to GitHub Pages

# Every pushed version tag (v1.0.0, v1.0.1, ...) publishes the site to GitHub Pages,
# served as static files at https://kymy07.github.io/Jotara/ (no build step, no
# container), then creates a GitHub Release from CHANGELOG.md. Plain pushes to main do
# not deploy. Manual runs via "Run workflow" redeploy the current VERSION.
#
# Cut a release with:  ./release.sh 1.0.1
#
# Optional: set the repository secrets FIREBASE_API_KEY, FIREBASE_MESSAGING_SENDER_ID
# and FIREBASE_APP_ID to inject the Firebase web config at deploy time instead of
# committing it. Any secret that is not set leaves js/firebase-config.js unchanged.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy-jotara
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          JS=$(grep -oP '(?<=JOTARA_VERSION = ")[^"]*' js/version.js)
          echo "VERSION file: $VERSION · js/version.js: $JS · ref: $GITHUB_REF_NAME"
          if [ "$VERSION" != "$JS" ]; then
            echo "::error::VERSION ($VERSION) and js/version.js ($JS) disagree"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $VERSION — use ./release.sh"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "## Deploying Jotara v$VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Inject Firebase config
        env:
          # Read via env, never interpolated straight into the script body.
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          CONFIG=js/firebase-config.js
          inject() {
            key="$1"; value="$2"
            if [ -z "$value" ]; then
              echo "$key secret not set — keeping the value committed in $CONFIG"
              return
            fi
            sed -i -E "s|(${key}: \")[^\"]*(\")|\1${value}\2|" "$CONFIG"
            grep -q "${key}: \"${value}\"" "$CONFIG" || { echo "::error::Could not inject $key"; exit 1; }
            echo "$key injected"
          }
          inject apiKey "$FIREBASE_API_KEY"
          inject messagingSenderId "$FIREBASE_MESSAGING_SENDER_ID"
          inject appId "$FIREBASE_APP_ID"

      - name: Stage site
        # Only what the browser needs: repo tooling, docs and dotfiles stay behind.
        run: |
          mkdir _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.firebaserc' \
            --exclude='firebase.json' \
            --exclude='database.rules.json' \
            --exclude='README.md'             --exclude='CHANGELOG.md'             --exclude='release.sh' \
            --exclude='_site' \
            ./ _site/
          touch _site/.nojekyll
          echo "Files published:"
          find _site -type f | sed 's|^_site/|  |' | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Health check
        env:
          BASE: ${{ steps.deployment.outputs.page_url }}
        run: |
          for page in "" auth.html app.html css/style.css js/app.js; do
            code=""
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -s -m 20 -o /dev/null -w "%{http_code}" "${BASE}${page}")
              [ "$code" = "200" ] && break
              sleep 10
            done
            echo "/$page -> HTTP $code"
            [ "$code" = "200" ] || exit 1
          done
          echo "Live at ${BASE}"
          echo "Live at ${BASE}" >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # This version's section of CHANGELOG.md becomes the release notes.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Jotara $VERSION" > notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Jotara $VERSION" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "Jotara $VERSION" --notes-file notes.md --verify-tag
          fi
